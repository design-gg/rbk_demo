<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="ad.size" content="width=100%,height=100%">
<title>RBC Adaptive Banner</title>

<script src="gsap.min.js"></script>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="index.js"></script>

<style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: #f7f7f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
        }

        #Stage {
            display: block;
            position: relative;
            width: min(100vw, 1060px);
            height: min(100vh, 1400px);
            min-width: 330px;
            min-height: 960px;
            overflow: hidden;
            background: #f7f7f5;
            box-shadow: 0 0 0 1px #000 inset;
            text-decoration: none;
            color: inherit;
        }

        /*
            Canvas получает область 80% x 80% баннера.
            Внутри CreateJS масштабируется РАВНОМЕРНО — без искажения.
            На высоких узких форматах у canvas появляется дополнительная
            логическая высота, которую используем для лёгкого растягивания
            композиции.
        */
        #canvasWrap {
            position: absolute;
            left: 5%;
            top: 8%;
            width: 90%;
            height: 90%;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Нижняя маркировка отдельно от Animate-canvas */
        #footer {
            position: absolute;
            left: 0;
            bottom: 16px;
            width: 100%;
            height: 48px;
            pointer-events: none;
        }

        #legal {
            position: absolute;
            left: 2%;
            bottom: 0;
            width: 70%;
            font-size: clamp(0.563rem, 0.296rem + 1.14vw, 1rem);
            line-height: 1.12;
            font-weight: 400;
        }

        #ageMark {
            position: absolute;
            right: 2%;
            bottom: 0;
            width: clamp(1.75rem, 1.217rem + 2.27vw, 2.625rem);
            aspect-ratio: 1;
            border: 1.5px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.75rem, 0.179rem + 2.44vw, 1.688rem);
            line-height: 1;
            font-weight: 400;
        }

        @media (max-width: 430px) {
            #footer {
                bottom: 12px;
            }

            #ageMark {
                      
            }
        }
</style>

<script>
var canvas, stage, exportRoot;

var BASE_W = 320;
var BASE_H = 450;
var MAX_DPR = 2;

var responsive = null;

var upperShift = 0;
var lowerExtra = 0;

var resizeRAF = null;
var resizeObserver = null;


function init() {
    canvas = document.getElementById("canvas");

    var comp = AdobeAn.getComposition("D146CE6CC62AB94B9DDC3CCFE6454AF1");
    var lib = comp.getLibrary();
    var loader = new createjs.LoadQueue(false);

    loader.addEventListener("fileload", function(evt) {
        handleFileLoad(evt, comp);
    });

    loader.addEventListener("complete", function(evt) {
        handleComplete(evt, comp);
    });

    loader.loadManifest(lib.properties.manifest);
}


function handleFileLoad(evt, comp) {
    var images = comp.getImages();

    if (evt && evt.item.type === "image") {
        images[evt.item.id] = evt.result;
    }
}


function handleComplete(evt, comp) {
    var lib = comp.getLibrary();
    var ss = comp.getSpriteSheet();
    var queue = evt.target;
    var ssMetadata = lib.ssMetadata;

    for (var i = 0; i < ssMetadata.length; i++) {
        ss[ssMetadata[i].name] = new createjs.SpriteSheet({
            images: [queue.getResult(ssMetadata[i].name)],
            frames: ssMetadata[i].frames
        });
    }

    /*
        Сначала создаём exportRoot.
    */
    exportRoot = new lib.slider();

    /*
        Потом создаём stage.
    */
    stage = new lib.Stage(canvas);
    stage.addChild(exportRoot);

    /*
        И только после этого ищем рамку кнопки.
    */
    var outline = exportRoot.getChildByName("btnOutline");

    /*
        Сохраняем исходные координаты объектов Animate.
    */
    responsive = {
        tx1Y: exportRoot.tx1.y,
        logoY: exportRoot.logo.y,
        btnY: exportRoot.btn.y,
        tx2Y: exportRoot.tx2.y,

        outline: outline,
        outlineY: outline ? outline.y : 0
    };

    createjs.Ticker.framerate = lib.properties.fps;

    /*
        Animate продолжает работать как обычно.
        На каждом кадре после расчёта адаптива
        задаём нужные координаты.
    */
    createjs.Ticker.addEventListener("tick", function(evt) {
        applyResponsivePositions();
        stage.update(evt);
    });

    /*
        Первый расчёт размеров.
    */
    resizeCreative();

    /*
        Следим именно за размером баннера,
        а не только за размером окна браузера.
        Это важно для demo-страницы с iframe.
    */
    resizeObserver = new ResizeObserver(function() {
        scheduleResize();
    });

    resizeObserver.observe(document.getElementById("Stage"));
    resizeObserver.observe(document.getElementById("canvasWrap"));

    window.addEventListener("resize", scheduleResize);

    AdobeAn.compositionLoaded(lib.properties.id);

    /*
        Нижняя маркировка.
    */
    gsap.from("#legal, #ageMark", {
        alpha: 0,
        duration: 0.5,
        ease: "power2.inOut",
        delay: 2.2
    });
}


function scheduleResize() {
    if (resizeRAF) {
        cancelAnimationFrame(resizeRAF);
    }

    resizeRAF = requestAnimationFrame(function() {
        resizeRAF = null;
        resizeCreative();
    });
}


function resizeCreative() {
    if (!canvas || !stage || !exportRoot || !responsive) return;

    var wrap = document.getElementById("canvasWrap");
    var stageEl = document.getElementById("Stage");

    var cssW = Math.max(1, wrap.clientWidth);
    var cssH = Math.max(1, wrap.clientHeight);

    var dpr = Math.min(
        window.devicePixelRatio || 1,
        MAX_DPR
    );

    /*
        Равномерно масштабируем исходный Animate 320x450.
        Пропорции не искажаются.
    */
    var scale = Math.min(
        cssW / BASE_W,
        cssH / BASE_H
    );

    var logicalW = cssW / scale;
    var logicalH = cssH / scale;

    /*
        Повышаем физическое разрешение canvas,
        чтобы изображения не становились мыльными.
    */
    canvas.width = Math.max(
        1,
        Math.round(cssW * dpr)
    );

    canvas.height = Math.max(
        1,
        Math.round(cssH * dpr)
    );

    stage.scaleX = scale * dpr;
    stage.scaleY = scale * dpr;

    /*
        Центрируем исходную композицию
        по горизонтали внутри canvasWrap.
    */
    exportRoot.x = (logicalW - BASE_W) / 2;
    exportRoot.y = 0;

    /*
        Вычисляем отношение ширины к высоте
        текущего баннера.
    */
    var ratio =
        stageEl.clientWidth /
        stageEl.clientHeight;

    /*
        330x960 = самый высокий/узкий формат.
        1060x1400 = самый широкий формат.
    */
    var minRatio = 330 / 960;
    var maxRatio = 1060 / 1400;

    /*
        tall:
        0 = широкий формат
        1 = максимально узкий/высокий
    */
    var tall =
        (maxRatio - ratio) /
        (maxRatio - minRatio);

    tall = Math.max(
        0,
        Math.min(1, tall)
    );

    /*
        НАСТРОЙКА РАССТОЯНИЙ.

        tx1 + logo + btn опускаются вместе.

        На 330x960:
        верхняя группа опустится максимум на 100 px.

        tx2 дополнительно опустится ещё на 80 px.
    */
    upperShift = 100 * tall;
    lowerExtra = 80 * tall;

    applyResponsivePositions();
}


function applyResponsivePositions() {
    if (!exportRoot || !responsive) return;

    /*
        tx1 + logo + btn остаются одним блоком.
        Расстояние между ними НЕ меняется.
    */
    exportRoot.tx1.y =
        responsive.tx1Y + upperShift;

    exportRoot.logo.y =
        responsive.logoY + upperShift;

    exportRoot.btn.y =
        responsive.btnY + upperShift;

    /*
        Рамка всегда следует за кнопкой.
    */
    if (responsive.outline) {
        responsive.outline.y =
            exportRoot.btn.y;
    }

    /*
        tx2 отодвигается дополнительно вниз.
    */
    exportRoot.tx2.y =
        responsive.tx2Y +
        upperShift +
        lowerExtra;
}
</script>
</head>

<body onload="init();">
<a href="%banner.reference_mrc_user1%" target="%banner.target%" id="Stage">

    <div id="canvasWrap">
        <canvas id="canvas" width="320" height="450"></canvas>
    </div>

    <div id="footer">
        <div id="legal">
            Реклама. Рекламодатель: ПАО&nbsp;«Газпром нефть», ИНН&nbsp;5504036333
        </div>

        <div id="ageMark">6+</div>
    </div>

</a>
</body>
</html>
