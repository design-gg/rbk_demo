<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="ad.size" content="width=100%,height=100%">
<title>RBC Adaptive Banner</title>

<script src="gsap.min.js"></script>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="index.js"></script>

<style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: #f7f7f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
        }

        #Stage {
            display: block;
            position: relative;
            width: min(100vw, 1060px);
            height: min(100vh, 1400px);
            min-width: 330px;
            min-height: 960px;
            overflow: hidden;
            background: #f7f7f5;
            box-shadow: 0 0 0 1px #000 inset;
            text-decoration: none;
            color: inherit;
        }

        /*
            Canvas получает область 80% x 80% баннера.
            Внутри CreateJS масштабируется РАВНОМЕРНО — без искажения.
            На высоких узких форматах у canvas появляется дополнительная
            логическая высота, которую используем для лёгкого растягивания
            композиции.
        */
        #canvasWrap {
            position: absolute;
            left: 5%;
            top: 8%;
            width: 90%;
            height: 90%;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Нижняя маркировка отдельно от Animate-canvas */
        #footer {
            position: absolute;
            left: 0;
            bottom: 16px;
            width: 100%;
            height: 48px;
            pointer-events: none;
        }

        #legal {
            position: absolute;
            left: 2%;
            bottom: 0;
            width: 70%;
            font-size: clamp(0.563rem, 0.296rem + 1.14vw, 1rem);
            line-height: 1.12;
            font-weight: 400;
        }

        #ageMark {
            position: absolute;
            right: 2%;
            bottom: 0;
            width: clamp(1.75rem, 1.217rem + 2.27vw, 2.625rem);
            aspect-ratio: 1;
            border: 1.5px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.75rem, 0.179rem + 2.44vw, 1.688rem);
            line-height: 1;
            font-weight: 400;
        }

        @media (max-width: 430px) {
            #footer {
                bottom: 12px;
            }

            #ageMark {
                      
            }
        }
</style>

<script>
var canvas, stage, exportRoot;

var BASE_W = 320;
var BASE_H = 450;
var MAX_DPR = 2;

var responsive = null;

function init() {
    canvas = document.getElementById("canvas");

    var comp = AdobeAn.getComposition("D146CE6CC62AB94B9DDC3CCFE6454AF1");
    var lib = comp.getLibrary();
    var loader = new createjs.LoadQueue(false);

    loader.addEventListener("fileload", function(evt) {
        handleFileLoad(evt, comp);
    });

    loader.addEventListener("complete", function(evt) {
        handleComplete(evt, comp);
    });

    loader.loadManifest(lib.properties.manifest);
}

function handleFileLoad(evt, comp) {
    var images = comp.getImages();

    if (evt && evt.item.type === "image") {
        images[evt.item.id] = evt.result;
    }
}

function handleComplete(evt, comp) {
    var lib = comp.getLibrary();
    var ss = comp.getSpriteSheet();
    var queue = evt.target;
    var ssMetadata = lib.ssMetadata;

    for (var i = 0; i < ssMetadata.length; i++) {
        ss[ssMetadata[i].name] = new createjs.SpriteSheet({
            images: [queue.getResult(ssMetadata[i].name)],
            frames: ssMetadata[i].frames
        });
    }

    exportRoot = new lib.slider();

    stage = new lib.Stage(canvas);
    stage.addChild(exportRoot);

    /*
        Запоминаем исходные позиции элементов,
        чтобы при resize всегда считать смещение
        от оригинальной верстки Animate.
    */
    responsive = {
        tx1Y: exportRoot.tx1.y,
        logoY: exportRoot.logo.y,
        btnY: exportRoot.btn.y,
        tx2Y: exportRoot.tx2.y
    };

    createjs.Ticker.framerate = lib.properties.fps;
    createjs.Ticker.addEventListener("tick", stage);

    resizeCreative();

    window.addEventListener("resize", resizeCreative);

    AdobeAn.compositionLoaded(lib.properties.id);

    gsap.from("#legal, #ageMark", {
        alpha: 0,
        duration: 0.5,
        ease: "power2.inOut",
        delay: 2.2
    });
}

function resizeCreative() {
    if (!canvas || !stage || !exportRoot || !responsive) return;

    var wrap = document.getElementById("canvasWrap");
    var stageEl = document.getElementById("Stage");

    var cssW = Math.max(1, wrap.clientWidth);
    var cssH = Math.max(1, wrap.clientHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

    /*
        Равномерное масштабирование исходной композиции 320x450.
        Никакого растягивания по одной из осей.
    */
    var scale = Math.min(cssW / BASE_W, cssH / BASE_H);

    var logicalW = cssW / scale;
    var logicalH = cssH / scale;

    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));

    stage.scaleX = scale * dpr;
    stage.scaleY = scale * dpr;

    /*
        Центрируем всю композицию по горизонтали.
    */
    exportRoot.x = (logicalW - BASE_W) / 2;
    exportRoot.y = 0;

    /*
        Чем формат уже и выше,
        тем больше вертикальные расстояния между блоками.
    */
    var ratio = stageEl.clientWidth / stageEl.clientHeight;

    var minRatio = 330 / 960;
    var maxRatio = 1060 / 1400;

    var tall = (maxRatio - ratio) / (maxRatio - minRatio);

    tall = Math.max(0, Math.min(1, tall));

    /*
        Максимальные смещения на 330x960.

        upperShift:
        cards -> tx1/logo/btn

        lowerExtra:
        дополнительное расстояние
        logo/btn -> tx2
    */
    var upperShift = 100 * tall;
    var lowerExtra = 80 * tall;

    /*
        Верхняя группа.
    */
    exportRoot.tx1.y = responsive.tx1Y + upperShift;
    exportRoot.logo.y = responsive.logoY + upperShift;
    exportRoot.btn.y = responsive.btnY + upperShift;

    /*
        tx2 сдвигаем на то же расстояние,
        плюс добавляем дополнительный промежуток.
    */
    exportRoot.tx2.y = responsive.tx2Y + upperShift + lowerExtra;

    stage.update();
}
</script>
</head>

<body onload="init();">
<a href="%banner.reference_mrc_user1%" target="%banner.target%" id="Stage">

    <div id="canvasWrap">
        <canvas id="canvas" width="320" height="450"></canvas>
    </div>

    <div id="footer">
        <div id="legal">
            Реклама. Рекламодатель: ПАО&nbsp;«Газпром нефть», ИНН&nbsp;5504036333
        </div>

        <div id="ageMark">6+</div>
    </div>

</a>
</body>
</html>
