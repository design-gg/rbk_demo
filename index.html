<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBC Adaptive Banner — Demo</title>
<style>
:root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --text: #111318;
    --muted: #69707a;
    --line: #d9dee5;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background: var(--bg);
}

body {
    min-height: 100vh;
    padding: 24px;
}

.demo {
    width: min(1500px, 100%);
    margin: 0 auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.15;
}

.header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.current-size {
    white-space: nowrap;
    font-size: 18px;
    font-weight: 700;
}

.controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
}

.presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
}

button {
    appearance: none;
    border: 1px solid #c9cfd7;
    background: #fff;
    color: #1a1d22;
    border-radius: 9px;
    padding: 9px 12px;
    font: inherit;
    cursor: pointer;
}

button:hover,
button.active {
    border-color: #111318;
    background: #111318;
    color: #fff;
}

.ranges {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.range-row {
    display: grid;
    grid-template-columns: 72px 1fr 70px;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
}

.range-row output {
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
}

input[type="range"] {
    width: 100%;
}

.preview-panel {
    position: relative;
    min-height: 720px;
    background:
        linear-gradient(45deg, #f5f6f8 25%, transparent 25%),
        linear-gradient(-45deg, #f5f6f8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f5f6f8 75%),
        linear-gradient(-45deg, transparent 75%, #f5f6f8 75%),
        #fff;
    background-size: 28px 28px;
    background-position: 0 0, 0 14px, 14px -14px, -14px 0px;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: auto;
    padding: 28px;
}

.preview-area {
    width: 100%;
    min-height: 650px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.scaled-box {
    position: relative;
    flex: 0 0 auto;
}

.frame {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    background: #fff;
    box-shadow: 0 10px 35px rgba(0,0,0,.14);
}

iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
}

.note {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
}

@media (max-width: 780px) {
    body { padding: 12px; }
    .header { align-items: flex-start; flex-direction: column; }
    .ranges { grid-template-columns: 1fr; }
    .preview-panel { padding: 14px; min-height: 600px; }
}
</style>
</head>
<body>
<div class="demo">
    <div class="header">
        <div>
            <h1>RBC — Adaptive Skyscraper</h1>
            <p>Один HTML5-креатив в разных размерах рекламного слота</p>
        </div>
        <div class="current-size" id="currentSize">330 × 960</div>
    </div>

    <div class="controls">
        <div class="presets">
            <button data-w="330" data-h="960">330×960</button>
            <button data-w="500" data-h="1000">500×1000</button>
            <button data-w="768" data-h="1200">768×1200</button>
            <button data-w="1060" data-h="1400">1060×1400</button>
        </div>

        <div class="ranges">
            <div class="range-row">
                <span>Ширина</span>
                <input id="widthRange" type="range" min="330" max="1060" step="1" value="330">
                <output id="widthValue">330 px</output>
            </div>
            <div class="range-row">
                <span>Высота</span>
                <input id="heightRange" type="range" min="960" max="1400" step="1" value="960">
                <output id="heightValue">960 px</output>
            </div>
        </div>
    </div>

    <div class="preview-panel" id="previewPanel">
        <div class="preview-area" id="previewArea">
            <div class="scaled-box" id="scaledBox">
                <div class="frame" id="frame">
                    <iframe id="bannerFrame" src="banner/index.html" title="RBC adaptive banner"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="note">
        Кнопки показывают контрольные размеры. Ползунками можно плавно менять ширину и высоту слота и наблюдать адаптацию баннера.
    </div>
</div>

<script>
const MIN_W = 330;
const MAX_W = 1060;
const MIN_H = 960;
const MAX_H = 1400;

const widthRange = document.getElementById('widthRange');
const heightRange = document.getElementById('heightRange');
const widthValue = document.getElementById('widthValue');
const heightValue = document.getElementById('heightValue');
const currentSize = document.getElementById('currentSize');
const previewPanel = document.getElementById('previewPanel');
const previewArea = document.getElementById('previewArea');
const scaledBox = document.getElementById('scaledBox');
const frame = document.getElementById('frame');
const buttons = [...document.querySelectorAll('[data-w][data-h]')];

function setSize(w, h) {
    w = Math.max(MIN_W, Math.min(MAX_W, Math.round(w)));
    h = Math.max(MIN_H, Math.min(MAX_H, Math.round(h)));

    widthRange.value = w;
    heightRange.value = h;
    widthValue.textContent = w + ' px';
    heightValue.textContent = h + ' px';
    currentSize.textContent = w + ' × ' + h;

    frame.style.width = w + 'px';
    frame.style.height = h + 'px';

    requestAnimationFrame(fitPreview);

    buttons.forEach(btn => {
        btn.classList.toggle(
            'active',
            Number(btn.dataset.w) === w && Number(btn.dataset.h) === h
        );
    });
}

function fitPreview() {
    const w = Number(widthRange.value);
    const h = Number(heightRange.value);

    const availableW = Math.max(280, previewArea.clientWidth);
    const availableH = Math.max(560, window.innerHeight - 260);

    const scale = Math.min(1, availableW / w, availableH / h);

    frame.style.transform = 'scale(' + scale + ')';
    scaledBox.style.width = Math.round(w * scale) + 'px';
    scaledBox.style.height = Math.round(h * scale) + 'px';
    previewArea.style.minHeight = Math.max(560, Math.round(h * scale)) + 'px';
}

widthRange.addEventListener('input', () => {
    setSize(Number(widthRange.value), Number(heightRange.value));
});

heightRange.addEventListener('input', () => {
    setSize(Number(widthRange.value), Number(heightRange.value));
});

buttons.forEach(btn => {
    btn.addEventListener('click', () => {
        setSize(Number(btn.dataset.w), Number(btn.dataset.h));
    });
});

window.addEventListener('resize', fitPreview);

setSize(330, 960);
</script>
</body>
</html>
