<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RBC Adaptive Banner — Demo</title>

<style>
:root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --text: #111318;
    --muted: #69707a;
    --line: #d9dee5;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

#Stage {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.demo {
    width: min(1500px, 100%);
    margin: 0 auto;
}


/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.15;
}

.header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.current-size {
    white-space: nowrap;
    font-size: 18px;
    font-weight: 700;
}


/* CONTROLS */

.controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
}

.presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

button {
    appearance: none;
    border: 1px solid #c9cfd7;
    background: #fff;
    color: #1a1d22;
    border-radius: 9px;
    padding: 9px 14px;
    font: inherit;
    cursor: pointer;
    transition:
        background .2s,
        color .2s,
        border-color .2s;
}

button:hover,
button.active {
    border-color: #111318;
    background: #111318;
    color: #fff;
}


/* PREVIEW */

.preview-panel {
    position: relative;
    min-height: 720px;

    background:
        linear-gradient(45deg, #f5f6f8 25%, transparent 25%),
        linear-gradient(-45deg, #f5f6f8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f5f6f8 75%),
        linear-gradient(-45deg, transparent 75%, #f5f6f8 75%),
        #fff;

    background-size: 28px 28px;

    background-position:
        0 0,
        0 14px,
        14px -14px,
        -14px 0;

    border: 1px solid var(--line);
    border-radius: 14px;

    overflow: hidden;

    padding: 28px;
}

.preview-area {
    width: 100%;
    min-height: 560px;

    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.scaled-box {
    position: relative;
    flex: 0 0 auto;
}

.frame {
    position: absolute;
    left: 0;
    top: 0;

    transform-origin: 0 0;

    background: #fff;

    box-shadow: 0 10px 35px rgba(0,0,0,.14);
    overflow: hidden;
}

iframe {
    display: block;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: #fff;
    overflow: hidden;
}


/* NOTE */

.note {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
}


/* MOBILE */

@media (max-width: 780px) {

    body {
        padding: 12px;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .preview-panel {
        padding: 14px;
        min-height: 600px;
    }
}
</style>

</head>


<body>

<div class="demo">


    <!-- HEADER -->

    <div class="header">

        <div>
            <h1>RBC — Adaptive Skyscraper</h1>

            <p>
                Один HTML5-креатив в разных размерах рекламного слота
            </p>
        </div>

        <div
            class="current-size"
            id="currentSize">
            1060 × 1400
        </div>

    </div>


    <!-- FORMATS -->

    <div class="controls">

        <div class="presets">

            <button
                data-w="1060"
                data-h="1400">
                1060×1400
            </button>

            <button
                data-w="768"
                data-h="1024">
                768×1024
            </button>

            <button
                data-w="425"
                data-h="960">
                425×960
            </button>

            <button
                data-w="330"
                data-h="960">
                330×960
            </button>

        </div>

    </div>


    <!-- PREVIEW -->

    <div
        class="preview-panel"
        id="previewPanel">

        <div
            class="preview-area"
            id="previewArea">

            <div
                class="scaled-box"
                id="scaledBox">

                <div
                    class="frame"
                    id="frame">

                    <iframe
                        id="bannerFrame"
                        src="adap_1060x1400_new/index.html"
                        title="RBC adaptive banner"
                        scrolling="no">
                    </iframe>

                </div>

            </div>

        </div>

    </div>


    <!-- NOTE -->

    <div class="note">
        Кнопки показывают контрольные размеры рекламного слота.
    </div>


</div>


<script>

const currentSize = document.getElementById("currentSize");
const previewPanel = document.getElementById("previewPanel");
const previewArea = document.getElementById("previewArea");
const scaledBox = document.getElementById("scaledBox");
const frame = document.getElementById("frame");
const bannerFrame = document.getElementById("bannerFrame");

const buttons = [
    ...document.querySelectorAll("[data-w][data-h]")
];

let currentW = 1060;
let currentH = 1400;


/* =========================
   SET FORMAT
========================= */

function setSize(w, h) {

    currentW = w;
    currentH = h;

    currentSize.textContent =
        w + " × " + h;

    /*
        iframe получает настоящий
        размер рекламного слота
    */

    frame.style.width =
        w + "px";

    frame.style.height =
        h + "px";


    /*
        Активная кнопка
    */

    buttons.forEach(btn => {

        btn.classList.toggle(
            "active",

            Number(btn.dataset.w) === w &&
            Number(btn.dataset.h) === h
        );

    });


    /*
        После изменения размера
        пересчитываем отображение
    */

    requestAnimationFrame(function() {

        fitPreview();

        /*
            Сообщаем баннеру,
            что размер iframe изменился
        */

        try {

            bannerFrame.contentWindow.dispatchEvent(
                new Event("resize")
            );

        } catch (e) {}

    });

}


/* =========================
   FIT PREVIEW
========================= */

function fitPreview() {

    const panelStyle =
        getComputedStyle(previewPanel);

    const paddingX =
        parseFloat(panelStyle.paddingLeft) +
        parseFloat(panelStyle.paddingRight);


    /*
        Доступная ширина
        внутри preview-panel
    */

    const availableW =
        Math.max(
            1,
            previewPanel.clientWidth - paddingX
        );


    /*
        Доступная высота
        для комфортного просмотра
    */

    const availableH =
        Math.max(
            500,
            window.innerHeight - 320
        );


    /*
        Сам iframe остаётся настоящего размера.

        Здесь уменьшается только
        его визуальное отображение.
    */

    const scale =
        Math.min(
            1,
            availableW / currentW,
            availableH / currentH
        );


    frame.style.transform =
        "scale(" + scale + ")";


    /*
        Размер контейнера после
        визуального масштабирования
    */

    scaledBox.style.width =
        Math.ceil(
            currentW * scale
        ) + "px";

    scaledBox.style.height =
        Math.ceil(
            currentH * scale
        ) + "px";


    previewArea.style.minHeight =
        Math.max(
            560,
            Math.ceil(currentH * scale)
        ) + "px";

}


/* =========================
   FORMAT BUTTONS
========================= */

buttons.forEach(btn => {

    btn.addEventListener(
        "click",
        function() {

            setSize(
                Number(btn.dataset.w),
                Number(btn.dataset.h)
            );

        }
    );

});


/* =========================
   WINDOW RESIZE
========================= */

window.addEventListener(
    "resize",
    function() {

        requestAnimationFrame(
            fitPreview
        );

    }
);


/* =========================
   START
========================= */

setSize(1060, 1400);

</script>

</body>
</html>
