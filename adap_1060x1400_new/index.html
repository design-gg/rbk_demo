<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Энергия недр</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
         <a href="%banner.reference_mrc_user1%" target="%banner.target%" id="Stage">


<div id="banner">


    <!-- =====================================================
         1. PHOTO
    ====================================================== -->

    <div class="photo">

        <img src="img/photo.jpg" alt="">

    </div>



    <!-- =====================================================
         2. MAIN CONTENT
    ====================================================== -->

    <div class="main-content">
          <div class="content-scale">

                  <!-- ГАЗПРОМ НЕФТЬ / ПРЕДСТАВЛЯЕТ -->
                  <div class="present-block">

                      <img class="gazprom" src="img/gazprom.svg" alt="Газпром нефть">
                      <img class="presents" src="img/presents.svg" alt="представляет">
                  </div>


                  <!-- ЭНЕРГИЯ НЕДР -->

                  <div class="brand">
                      <img class="logo" src="img/logo.svg" alt="Энергия недр">

                      <!-- ВЫСТАВКА-ОТКРЫТИЕ -->
                      <div class="exhibition">
                         <img class="exhibition-text" src="img/exhibition.svg" alt="Выставка-открытие">
                         <svg class="exhibition-outline"><rect class="outline-path"/></svg>
                      </div>

                 </div>





                  <!-- ХАНТЫ-МАНСИЙСК -->

                  <img class="location"
                       src="img/location.png"
                       alt="">



                  <!-- ПРИ ПОДДЕРЖКЕ -->

                  <img class="support"
                       src="img/supp.png"
                       alt="">
          </div>


    </div>



    <!-- =====================================================
         3. FOOTER
    ====================================================== -->

    <div class="footer">

        <img class="legal"
             src="img/legal.png"
             alt="">

        <img class="age"
             src="img/age.svg"
             alt="6+">

    </div>


</div>

</a>

<script src="gsap.min.js"></script>
<script src="script.js"></script>


</body>

</html>
